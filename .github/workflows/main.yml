on:
  pull_request:
    branches: [main]
    paths:
      - 'readme.md'
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: awesome-lint
        run: ./.github/workflows/repo_linter.sh
name: Release APK
on:
 push:
 tags:
 - "v"
 workflow_dispatch:
permissions:
 contents: write
jobs:
 build-release:
 runs-on: ubuntu-latest
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Ensure gradlew is executable
    run: chmod +x ./gradlew

  - name: Cache Gradle
    uses: actions/cache@v4
    with:
      path: |
        ~/.gradle/caches
        ~/.gradle/wrapper
      key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle*') }}
      restore-keys: |
        ${{ runner.os }}-gradle-

  - name: Install Android SDK
    run: |
      set -e
      sudo apt-get update
      sudo apt-get install -y wget unzip
      mkdir -p $HOME/android-sdk/cmdline-tools
      cd $HOME/android-sdk
      wget -q https://dl.google.com/android/repository/commandlinetools-linux-latest.zip -O cmdline-tools.zip
      unzip -q cmdline-tools.zip -d cmdline-tools_tmp
      mkdir -p cmdline-tools/latest
      mv cmdline-tools_tmp/cmdline-tools/* cmdline-tools/latest/
      rm -rf cmdline-tools.zip cmdline-tools_tmp
      export ANDROID_SDK_ROOT=$HOME/android-sdk
      export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
      yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses
      sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
      echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
      echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

  - name: Build Release APK
    run: ./gradlew assembleRelease --no-daemon

  - name: Find APK
    id: find_apk
    run: |
      echo "APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)" >> $GITHUB_ENV

  - name: Upload APK to GitHub Release
    uses: softprops/action-gh-release@v2
    if: startsWith(github.ref, 'refs/tags/')
    with:
      files: |
        app/build/outputs/apk/release/*.apk

  - name: Upload APK as workflow artifact
    uses: actions/upload-artifact@v4
    with:
      name: SimpleCam-APK
      path: |
        app/build/outputs/apk/release/*.apk

